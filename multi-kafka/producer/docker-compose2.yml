services:
  kafka1:
    image: apache/kafka:latest
    container_name: kafka1
    ports:
      - "9092:9092"
    volumes:
      - ./data/kafka1:/kafka/kraft-combined-logs
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_LOG_DIRS: /kafka/kraft-combined-logs
    command: >
       bash -c "if [ ! -f /kafka/kraft-combined-logs/meta.properties ]; then
       /opt/kafka/bin/kafka-storage.sh format -t Mk3OEYBSD34fcwNTJENDM2Qk -c /opt/kafka/config/kraft/server.properties --ignore-formatted --standalone;
       fi &&
       /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties"
    networks: [kafka-net]

  kafka2:
    image: apache/kafka:latest
    container_name: kafka2
    volumes:
      - ./data/kafka2:/kafka/kraft-combined-logs
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_LOG_DIRS: /kafka/kraft-combined-logs
    command: >
     bash -c "if [ ! -f /kafka/kraft-combined-logs/meta.properties ]; then
     /opt/kafka/bin/kafka-storage.sh format -t Mk3OEYBSD34fcwNTJENDM2Qk -c /opt/kafka/config/kraft/server.properties --ignore-formatted --standalone;
     fi &&
     /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties"
    networks: [kafka-net]

  kafka3:
    image: apache/kafka:latest
    container_name: kafka3
    volumes:
      - ./data/kafka3:/kafka/kraft-combined-logs
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_LOG_DIRS: /kafka/kraft-combined-logs
    command: >
     bash -c "if [ ! -f /kafka/kraft-combined-logs/meta.properties ]; then
     /opt/kafka/bin/kafka-storage.sh format -t Mk3OEYBSD34fcwNTJENDM2Qk -c /opt/kafka/config/kraft/server.properties --ignore-formatted --standalone;
     fi &&
     /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties"
    networks: [kafka-net]


  producer:
    image : producer:V1
    build: ./producer
    environment:
      TOPIC_NAME: ${TOPIC_NAME}
      MESSAGE_TEXT: ${MESSAGE_TEXT}
      RATE_PER_SEC: ${RATE_PER_SEC}
      DURATION: ${DURATION}
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    depends_on: [kafka1, kafka2, kafka3]
    networks: [kafka-net]

  consumer:
    image: consumer:V1
    build: ./consumer
    environment:
     TOPIC_NAME: ${TOPIC_NAME}
     KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092

    depends_on: [kafka1, kafka2, kafka3]
    networks: [kafka-net]

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
    depends_on: [kafka1, kafka2, kafka3]
    networks: [kafka-net]

networks:
  kafka-net:
    driver: bridge
